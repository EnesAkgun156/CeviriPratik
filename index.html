<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çeviri Pratiği</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1128;--card:#141d38;--tx:#e8eefb;--mut:#8b9bc0;--bd:#26345c;--ac:#22d3ee;--ac2:#3b82f6;--ok:#5fd68f;--okb:#17382a;--no:#ff8a8a;--nob:#432024;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1128;--card:#141d38;--tx:#e8eefb;--mut:#8b9bc0;--bd:#26345c;--ac:#22d3ee;--ac2:#3b82f6;--ok:#5fd68f;--okb:#17382a;--no:#ff8a8a;--nob:#432024;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.hl,.chip{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#3b82f6);display:grid;place-items:center;font-weight:800;color:#0a1128;flex:none}
.ttl{font-weight:800;font-size:1.25rem;line-height:1.1;background:linear-gradient(90deg,#22d3ee,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{border:1px solid var(--bd);border-radius:12px;padding:6px 12px;background:var(--bg)}.chip b{display:block;font-size:.8rem}.chip i{font-style:normal;color:#fbbf24;font-weight:700;font-size:.78rem}
.pav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#3b82f6);display:grid;place-items:center;font-weight:800;color:#0a1128;flex:none}.pav.big{width:52px;height:52px;font-size:1.3rem;margin:0 auto 8px}
.sw{border:1px solid var(--ac);background:none;color:var(--ac);padding:8px 12px;border-radius:10px;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer}
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 0,#14265a,#050b1f 70%);overflow:auto;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 30px;text-align:center}#gate.hide{display:none}
.gbox{max-width:640px;margin:0 auto}.gbox .logo{width:64px;height:64px;font-size:1.4rem;margin:0 auto 14px}.gbox h2{margin:0 0 6px;font-size:2rem;background:linear-gradient(90deg,#22d3ee,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#gList{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0 26px}.pc{width:140px;padding:18px 10px;border:1px solid var(--bd);border-radius:14px;background:#0d2540;cursor:pointer}.pc:hover{border-color:var(--ac)}.pc b{display:block}
.gnew{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:left}.gnew input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
label[for=nm],#nm{display:none}
.pst{grid-template-columns:repeat(4,minmax(0,1fr)) !important}.pst .stat{transition:transform .2s ease,box-shadow .25s ease,outline-color .2s;outline:2px solid transparent;padding:10px 4px}.pst .stat b{font-size:1.15rem}
.pst .stat:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(34,211,238,.2)}.pst .pick{cursor:pointer}.pst .pick.act{outline-color:var(--ac)}.rl{display:block;transition:opacity .15s}
#gAsk{position:fixed;inset:0;z-index:60;background:rgba(5,11,31,.82);display:grid;place-items:center;padding:16px}#gAsk.hide{display:none}#gate .gnew input{width:100%;flex:none}
.pst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:-2px 0 14px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.rb{height:10px;border-radius:99px;background:var(--no);overflow:hidden;margin-top:6px}.rb i{display:block;height:100%;background:var(--ok);transition:width .8s ease}
#gen{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 0 2px transparent}#gen svg{fill:#fde047;flex:none}#gen.busy:disabled{opacity:1;cursor:wait}
#gen:hover,#gen.busy{animation:led 1.4s linear infinite}
@keyframes led{0%{box-shadow:0 0 0 2px #f0abfc,0 0 16px 2px #ec4899}33%{box-shadow:0 0 0 2px #22d3ee,0 0 16px 2px #22d3ee}66%{box-shadow:0 0 0 2px #fde047,0 0 16px 2px #fde047}100%{box-shadow:0 0 0 2px #f0abfc,0 0 16px 2px #ec4899}}
#go{width:auto;min-width:150px;padding:11px 28px;margin:14px 0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.pot{margin-top:10px;font-size:.9rem;color:var(--mut)}.pot b{color:#fbbf24}
button,.prof,.pc,.sent,tr[data-id]{transition:transform .18s ease,box-shadow .25s ease,background .25s ease,color .2s ease,border-color .2s ease,opacity .2s}
nav button{display:flex;align-items:center;justify-content:center;gap:8px}nav button:hover{color:#7dd3fc}nav button.on:hover{color:#7dd3fc;box-shadow:inset 0 -2px 0 #7dd3fc}
.go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(34,211,238,.28)}.go:active:not(:disabled){transform:scale(.98)}
.sw:hover,.sm:hover{background:rgba(125,211,252,.12);color:#7dd3fc;border-color:#7dd3fc}.del:hover{transform:scale(1.15)}
.prof:hover,.pc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(34,211,238,.15)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section,#result>*{animation:up .4s ease both}#gate{animation:up .35s ease both}.bar i{transition:width .8s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}header p{margin:0;opacity:.9}
main{max-width:900px;margin:20px auto 40px;padding:0 16px}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:none;color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(60,60,120,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin-bottom:6px}small{color:var(--mut)}
textarea{width:100%;min-height:170px;resize:vertical;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.go{margin-top:14px;width:100%;border:0;padding:14px;border-radius:12px;font:inherit;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{color:var(--no);margin-top:10px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;flex:none}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;flex:1;min-width:240px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.4rem}.stat small{font-size:.78rem}
.sent{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.sent .src{color:var(--mut);font-size:.92rem;margin-bottom:6px}
.g{background:var(--okb);color:var(--ok);border-radius:5px;padding:1px 4px}
.r{background:var(--nob);color:var(--no);border-radius:5px;padding:1px 4px;text-decoration:line-through}
.fix{background:var(--okb);color:var(--ok);border-radius:5px;padding:1px 4px;font-weight:600}
.ref{margin-top:8px;font-size:.92rem}.ref b{color:var(--ok)}.note{color:var(--mut);font-size:.88rem;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:.93rem}th{color:var(--mut);font-weight:600}
.pill{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:3px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:800;font-size:.9rem}.med{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid;font-size:.8rem;font-weight:800}.m1{color:#f5b301}.m2{color:#aab4c8}.m3{color:#cd7f32}
.hide{display:none}input#nm{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:14px}input#nm:focus{outline:2px solid var(--ac);border-color:transparent}.sm{display:block;margin:10px auto 0;border:1px solid var(--bd);background:none;color:var(--mut);padding:6px 14px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}.sm:disabled{opacity:.6;cursor:wait}#autoOut{margin:12px 0 0;background:var(--bg)}tr[data-id]:hover{background:var(--bg)}.prof{display:flex;gap:14px;align-items:center;cursor:pointer;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}.prof:hover{border-color:var(--ac)}.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;flex:none}.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,var(--ac));border-radius:99px}th[data-k]{cursor:pointer;user-select:none;white-space:nowrap}th[data-k]:hover{color:var(--ac)}.del{border:0;background:none;cursor:pointer;font:inherit;color:var(--mut);display:inline-flex;align-items:center}.del:hover{color:var(--no)}.gen{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;padding:12px;background:var(--bg);border-radius:12px}.gen div{flex:1;min-width:120px}.gen select,.gen input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}.gen button{border:0;padding:11px 16px;border-radius:10px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}.gen button:disabled{opacity:.6;cursor:wait}.empty{text-align:center;color:var(--mut);padding:24px}
.tools{display:flex;justify-content:flex-end;margin-bottom:8px}.tools button{border:1px solid var(--bd);background:none;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<header><div class="hl"><div class="logo">A文</div><div><div class="ttl">Pratik Çeviri</div><small style="font-size:.68rem;letter-spacing:1px">ÇEVİR &amp; XP KAZAN</small></div></div>
<div class="hl"><div class="chip"><div class="pav" id="chipA">?</div><div><b id="chipN">—</b><i id="chipX">0 XP</i></div></div><button class="sw" id="swBtn">Profil Değiştir</button></div></header>
<div id="gate"><div class="gbox"><div class="logo">A文</div><h2>Pratik Çeviri’ye Hoş Geldiniz</h2><p style="color:var(--mut)">Devam etmek için bir profil seçin veya yeni bir profil oluşturun.</p>
<div style="text-align:left"><small>KAYITLI PROFİLLER</small></div><div id="gList"></div>
<div class="gnew"><b style="color:var(--ac)">YENİ PROFİL</b><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px"><input id="gName" maxlength="30" placeholder="Profil adı"><input id="gPass" type="password" maxlength="40" placeholder="Şifre"><input id="gPass2" type="password" maxlength="40" placeholder="Şifre tekrar (sadece yeni profil için)"><button class="go" id="gGo" style="width:auto;margin:0;padding:12px 20px;align-self:flex-end">Giriş Yap / Başla →</button></div><div id="gErr" style="color:var(--no);margin-top:8px;min-height:1.2em"></div></div>
<details id="apiBox" style="margin-top:16px;text-align:left"><summary style="cursor:pointer;color:var(--mut)">API ayarları <span id="apiSt"></span></summary><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="apiUrl" placeholder="https://api-adresin.com" autocomplete="off" style="flex:1;min-width:200px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit"><button class="go" id="apiSave" style="width:auto;margin:0;padding:12px 20px">Kaydet</button></div></details></div></div>
<div id="gAsk" class="hide"><div class="gnew" style="width:min(340px,92vw)"><b id="gAskT"></b><input id="gAskPw" type="password" maxlength="40" placeholder="Şifre" style="width:100%;margin-top:10px"><input id="gAskPw2" class="hide" type="password" maxlength="40" placeholder="Şifre tekrar" style="width:100%;margin-top:8px"><div id="gAskErr" style="color:var(--no);margin-top:8px;min-height:1.2em"></div><div style="display:flex;gap:8px;margin-top:6px"><button class="go" id="gAskGo" style="margin:0;flex:1">Giriş</button><button class="sm" id="gAskX" type="button" style="margin:0">İptal</button></div></div></div>
<main>
<nav><button class="on" data-t="practice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Pratik</button><button data-t="rank"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Çeviriler</button><button data-t="hist"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2"/><path d="M16 3.1a4 4 0 010 7.8M22 21v-2a4 4 0 00-3-3.9"/></svg>Arkadaşlar</button></nav>

<section id="practice">
<div id="form"><div class="card">
<label for="nm">Adın</label><input id="nm" maxlength="30" placeholder="İsmini yaz" autocomplete="nickname">
<div class="gen"><div><label for="lvl">Seviye</label><select id="lvl"><option selected>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></div><div><label for="lng">Paragraf dili</label><select id="lng"><option value="en">İngilizce</option><option value="tr">Türkçe</option><option value="any">Rastgele</option></select></div><div><label for="cnt">Cümle sayısı</label><input id="cnt" type="number" min="1" max="30" value="1" inputmode="numeric"></div><button id="gen" type="button"></button></div>
<div class="grid">
<div><label for="src">1) Paragraf <small>(Türkçe veya İngilizce)</small></label><textarea id="src" placeholder="Örn: Yesterday I went to the market and bought some fresh fruit."></textarea></div>
<div><label for="usr">2) Senin çevirin <small>(karşı dil)</small></label><textarea id="usr" placeholder="Örn: Dün markete gittim ve taze meyve aldım."></textarea></div>
</div>
<div id="pot" class="pot"></div>
<button class="go" id="go">Çevir</button>
<button class="sm" id="auto" type="button">Otomatik çevir</button><div class="card hide" id="autoOut"></div>
<div class="err" id="err"></div>
</div></div>
<div id="result"></div>
</section>

<section id="rank" class="hide"><div class="card"><h3 style="margin-top:0">En yüksek puanlar</h3><div id="rankBody"></div></div></section>
<section id="hist" class="hide"><div class="card"><div id="histBody"></div></div></section>
</main>

<script>
/* ===== API BAĞLANTISI =====
   Python API adresini (sonunda / olmadan) aşağıya yazabilirsin.
   Boş bırakırsan site açılışında "API ayarları" kutusundan girebilirsin. */
const DEFAULT_API="";
(function(){
  const UK="cp-api-url",g=i=>document.getElementById(i);
  const ls=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
  const base=()=>(ls(UK)||DEFAULT_API).trim().replace(/\/+$/,"");
  function st(){g("apiSt").textContent=base()?"· ayarlı":"· gerekli";g("apiUrl").value=ls(UK)||DEFAULT_API;}
  st();
  g("apiSave").onclick=()=>{try{localStorage.setItem(UK,g("apiUrl").value.trim())}catch(e){}st();g("apiBox").open=false};
  function pick(d){
    if(typeof d==="string")return d;
    if(!d||typeof d!=="object")return "";
    for(const k of ["text","response","result","answer","output","content","message","reply"])if(typeof d[k]==="string")return d[k];
    const c=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
    return c?c.map(p=>p.text||"").join(""):JSON.stringify(d);
  }
  async function ask(prompt){
    const r=await fetch(base()+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){d=raw}
    if(!r.ok){const e=new Error((d&&d.detail&&(typeof d.detail==="string"?d.detail:JSON.stringify(d.detail)))||("HTTP "+r.status));e.code=r.status===429?"rate_limited":"api_error";throw e}
    return {raw:d,text:pick(d)};
  }
  const sample=async p=>({text:(await ask(p)).text});
  sample.json=async p=>{
    const {raw,text}=await ask(p);
    const a=text.indexOf("{"),b=text.lastIndexOf("}");
    if(a>=0&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(e){}}
    if(raw&&typeof raw==="object")return raw;
    throw new Error("API’den geçerli yanıt gelmedi, tekrar dene.");
  };
  window.claude={use:async n=>{if(n!=="sample")return null;if(!base()){g("apiBox").open=true;return null}return sample}};
})();
const $=s=>document.querySelector(s);
const GI='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M11 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M19 15l.9 2.4 2.4.9-2.4.9L19 21.6l-.9-2.4-2.4-.9 2.4-.9z"/></svg>';
const XI='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const LK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
const KEY="ceviri-pratigi-v1";
let attempts=[];
try{attempts=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){attempts=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(attempts))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=n=>n>=80?"#16a05a":n>=50?"#e49b0f":"#d93a3a";
const words=t=>(t.trim().match(/[\p{L}\p{N}’'-]+/gu)||[]).length;

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["practice","rank","hist"].forEach(id=>$("#"+id).classList.toggle("hide",id!==b.dataset.t));
  if(b.dataset.t==="rank")renderRank();if(b.dataset.t==="hist")renderHist();
});

function segHTML(segs){return (segs||[]).map(s=>{
  if(s.ok)return `<span class="g">${esc(s.t)}</span>`;
  return `<span class="r">${esc(s.t)}</span>`+(s.fix?` <span class="fix">${esc(s.fix)}</span>`:"");
}).join(" ")}

function renderResult(a){try{chip()}catch(e){}
  const sents=a.sentences||[];
  $("#form").classList.add("hide");$("#result").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><b>${esc(a.name||"İsimsiz")}</b> <small>· Seviye: ${esc(a.lvl||"—")}</small><button class="go" style="width:auto;margin:0;padding:10px 18px" onclick="restart()">Yeniden başla</button></div>${a.up?`<div class="card" style="text-align:center;font-weight:800;font-size:1.1rem">Tebrikler ${esc(a.name)}, Seviye ${a.up} oldun!</div>`:""}<div class="card"><div class="score">
  <div class="ring" style="background:conic-gradient(${col(a.score)} ${a.score*3.6}deg,var(--bd) 0)"><span style="color:${col(a.score)}">${a.score}</span></div>
  <div class="stats">
   <div class="stat"><b>${a.srcWords}</b><small>kelime (paragraf)</small></div>
   <div class="stat"><b>${sents.length}</b><small>cümle</small></div>
   <div class="stat"><b style="color:var(--ok)">${a.correct}/${sents.length}</b><small>doğru çevrilen cümle</small></div>
   <div class="stat"><b style="color:var(--ok)">${cw(a).ok}/${cw(a).all}</b><small>doğru kelime</small></div>
   <div class="stat"><b style="color:var(--ac)">+${attXP(a)}</b><small>XP kazandın</small></div>
   <div class="stat"><b>${a.usrWords}</b><small>kelime (çevirin)</small></div>
  </div></div>
  <p style="margin:14px 0 0"><span class="g">doğru</span> <span class="r">hatalı</span> <span class="fix">doğrusu</span> · ${esc(a.dir)}</p></div>
  <div class="card"><h3 style="margin-top:0">Çevrilecek metin</h3><p style="margin:0;white-space:pre-wrap">${esc(a.src)}</p></div>
  <div class="card"><h3 style="margin-top:0">Tam doğru çeviri</h3><p style="margin:0">${sents.map(s=>`<span class="g">${esc(s.reference)}</span>`).join(" ")}</p></div>
  <div class="card"><h3 style="margin-top:0">Senin çevirin</h3><p style="margin:0">${sents.map(s=>segHTML(s.segments)).join(" ")}</p></div>
  ${sents.map((s,i)=>`<div class="card sent" style="margin-bottom:0">
   <div class="src"><b>${i+1}.</b> ${esc(s.source)}</div>
   <div>${segHTML(s.segments)}</div>
   <div class="ref"><b>Doğru çeviri:</b> ${esc(s.reference)}</div>
   ${s.note?`<div class="note">${esc(s.note)}</div>`:""}</div>`).join("")}<button class="go" onclick="restart()">Yeniden başla</button>`;
}

function cw(a){let ok=0,all=0;(a.sentences||[]).forEach(s=>(s.segments||[]).forEach(g=>{if(g.t==="(çevrilmemiş)")return;const n=words(g.t||"");all+=n;if(g.ok)ok+=n}));return {ok,all}}
let rankSort={k:"score",d:-1};
const LV=["A1","A2","B1","B2","C1","C2","D1","D2"];
const RCOLS=[["name","İsim"],["lvl","Seviye"],["score","Puan"],["dir","Yön"],["correct","Doğru cümle"],["words","Doğru kelime"],["id","Tarih"]];
function rv(a,k){if(k==="name")return (a.name||"").toLocaleLowerCase("tr");if(k==="lvl"){const i=LV.indexOf(a.lvl);return i<0?99:i}if(k==="dir")return a.dir||"";if(k==="correct")return a.correct;if(k==="words")return cw(a).ok;return a[k]}
const fmtDT=t=>new Date(t).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function renderRank(){
  const {k,d}=rankSort;
  const list=[...attempts].sort((a,b)=>{const x=rv(a,k),y=rv(b,k);const c=typeof x==="string"?x.localeCompare(y,"tr"):x-y;return (c*d)||(b.score-a.score)||(b.id-a.id)});
  const MED=[1,2,3].map(n=>`<span class="med m${n}">${n}</span>`),medalOf={};[...attempts].sort((a,b)=>b.score-a.score||b.id-a.id).slice(0,3).forEach((a,i)=>medalOf[a.id]=MED[i]);
  $("#rankBody").innerHTML=list.length?`<small>Bir başlığa tıklayarak o kategoriye göre sırala; tekrar tıklayınca yön değişir.</small><div style="overflow-x:auto"><table><tr><th>#</th>${RCOLS.map(c=>`<th data-k="${c[0]}">${c[1]}${k===c[0]?(d>0?" ▲":" ▼"):""}</th>`).join("")}<th></th></tr>${list.map((a,i)=>`<tr data-id="${a.id}" style="cursor:pointer"><td>${medalOf[a.id]||i+1}</td><td><b>${esc(a.name||"İsimsiz")}</b></td><td><b>${esc(a.lvl||"—")}</b></td><td><span class="pill" style="--c:${col(a.score)}">${a.score}</span></td><td>${esc(a.dir)}</td><td>${a.correct}/${a.sentences.length}</td><td>${cw(a).ok}/${cw(a).all}</td><td style="white-space:nowrap">${fmtDT(a.id)}</td><td><button class="del" data-del="${a.id}" title="Sil">${XI}</button></td></tr>`).join("")}</table></div>`:`<div class="empty">Henüz deneme yok.</div>`;
  document.querySelectorAll("#rankBody th[data-k]").forEach(th=>th.onclick=()=>{const c=th.dataset.k;if(rankSort.k===c)rankSort.d*=-1;else rankSort={k:c,d:["name","lvl","dir"].includes(c)?1:-1};renderRank()});
bindOpen("#rankBody");bindDel("#rankBody",renderRank);}
const pkey=n=>String(n||"İsimsiz").trim().toLocaleLowerCase("tr");
const attXP=a=>cw(a).ok*10;
const profXP=n=>attempts.filter(x=>pkey(x.name)===pkey(n)).reduce((t,x)=>t+attXP(x),0);
let openProf=null;
const HEAD='<svg viewBox="0 0 24 24" width="32" height="32" fill="#fff" aria-hidden="true"><circle cx="12" cy="8" r="4.6"/><path d="M3.5 21.5c0-4.8 3.8-8.2 8.5-8.2s8.5 3.4 8.5 8.2z"/></svg>';
function renderHist(){
  const map={};
  attempts.forEach(a=>{const k=pkey(a.name);const p=map[k]||(map[k]={k,name:a.name||"İsimsiz",list:[],xp:0,last:0});p.list.push(a);p.xp+=attXP(a);if(a.id>p.last){p.last=a.id;p.name=a.name||"İsimsiz"}});
  if(!map.enes)map.enes={k:"enes",name:"Enes",list:[],xp:0,last:0};
  const profs=Object.values(map).sort((a,b)=>b.xp-a.xp||b.last-a.last);
  $("#histBody").innerHTML=profs.length?profs.map(p=>{
    const lv=Math.floor(p.xp/2000)+1,cur=p.xp%2000,open=openProf===p.k;
    let wOk=0,wAll=0,sOk=0,sAll=0;p.list.forEach(a=>{const c=cw(a);wOk+=c.ok;wAll+=c.all;sOk+=a.correct;sAll+=a.sentences.length});
    const wR=wAll?Math.round(wOk/wAll*100):0,sR=sAll?Math.round(sOk/sAll*100):0;
    const T=(v,l,c,x,cls)=>`<div class="stat${cls||""}"${x||""}><b${c?` style="color:${c}"`:""}>${v}</b><small>${l}</small></div>`;
    const bw=` data-bar="${wR}" data-lbl="Kelime oranı: %${wR} doğru · %${100-wR} yanlış"`,bs=` data-bar="${sR}" data-lbl="Cümle oranı: %${sR} doğru · %${100-sR} yanlış"`;
    const rows=open?`<div class="pst">${T(p.xp,"Toplam XP","#fbbf24")}${T(p.list.length,"Deneme")}${T(wOk,"Doğru kelime","var(--ok)")}${T(wAll-wOk,"Yanlış kelime","var(--no)")}${T("%"+wR,"Kelime doğruluğu","",bw," pick act")}${T(sOk,"Doğru cümle","var(--ok)")}${T(sAll-sOk,"Yanlış cümle","var(--no)")}${T("%"+sR,"Cümle doğruluğu","",bs," pick")}<div style="grid-column:1/-1"><small class="rl">Kelime oranı: %${wR} doğru · %${100-wR} yanlış</small><div class="rb"><i data-w="${wR}" style="width:0%"></i></div></div></div>`:"";
    return `<div class="prof" data-p="${esc(p.k)}"><div class="av">${HEAD}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(p.name)}</b><b style="color:var(--ac)">Seviye ${lv}</b></div><div class="bar" style="margin:8px 0 4px"><i style="width:${cur/20}%"></i></div><small>${cur} / 2000 XP · toplam ${p.xp} XP · ${p.list.length} deneme ${open?"▲":"▼"}</small></div>${p.k==="enes"?`<span title="Korumalı profil" style="color:var(--mut);display:grid">${LK}</span>`:`<button class="del" data-delp="${esc(p.k)}" title="Profili sil" style="font-size:1.2rem">${XI}</button>`}</div>${rows}`}).join(""):`<div class="empty">Henüz profil yok. Bir deneme yaptığında profilin otomatik oluşur.</div>`;
  document.querySelectorAll("#histBody [data-p]").forEach(el=>el.onclick=()=>{openProf=openProf===el.dataset.p?null:el.dataset.p;renderHist()});
  bindDel("#histBody",renderHist);bindOpen("#histBody");
  document.querySelectorAll("#histBody .pick").forEach(t=>t.onclick=e=>{e.stopPropagation();const b=t.closest(".pst");b.querySelectorAll(".pick").forEach(x=>x.classList.toggle("act",x===t));const l=b.querySelector(".rl");l.style.opacity=0;setTimeout(()=>{l.textContent=t.dataset.lbl;l.style.opacity=1},150);b.querySelector(".rb i").style.width=t.dataset.bar+"%"});
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("#histBody .rb i").forEach(i=>i.style.width=i.dataset.w+"%")));
  document.querySelectorAll("#histBody [data-delp]").forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.delp;if(k==="enes")return;if(!b.dataset.arm){b.dataset.arm=1;const o=b.innerHTML;b.innerHTML="Emin misin?";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.innerHTML=o}},3000);return}attempts=attempts.filter(x=>pkey(x.name)!==k);save();if(openProf===k)openProf=null;renderHist()});
}
function openAttempt(id){const a=attempts.find(x=>x.id==id);if(!a)return;renderResult(a);document.querySelector('nav button[data-t="practice"]').click();window.scrollTo({top:0,behavior:"smooth"})}
function bindOpen(sel){document.querySelectorAll(sel+" [data-id]").forEach(el=>el.onclick=()=>openAttempt(el.dataset.id))}
function restart(){setTimeout(updatePot,0);$("#src").value="";$("#usr").value="";$("#err").textContent="";$("#result").innerHTML="";$("#autoOut").classList.add("hide");$("#form").classList.remove("hide");window.scrollTo({top:0,behavior:"smooth"})}
try{$("#nm").value=localStorage.getItem("cp-name")||""}catch(e){}
function bindDel(sel,re){document.querySelectorAll(sel+" [data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();if(!b.dataset.arm){b.dataset.arm=1;const o=b.innerHTML;b.innerHTML="Emin misin?";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.innerHTML=o}},3000);return}attempts=attempts.filter(x=>String(x.id)!==b.dataset.del);save();re()})}
const TOPICS=["daily routine","travel","food and cooking","technology","health","friendship","nature and weather","school and work","city life","hobbies","family","shopping","history","science","culture and art","sports","the environment","a short story"];
$("#gen").onclick=async()=>{
  $("#err").textContent="";
  const sample=await claude.use("sample");
  if(!sample){$("#err").textContent="Paragraf üretimi şu an kullanılamıyor (önce API adresini gir: Profil Değiştir → API ayarları).";return}
  const lvl=$("#lvl").value;const n=Math.max(1,Math.min(30,parseInt($("#cnt").value)||1));$("#cnt").value=n;let l=$("#lng").value;if(l==="any")l=Math.random()<.5?"en":"tr";
  const lang=l==="en"?"English":"Turkish",topic=TOPICS[Math.floor(Math.random()*TOPICS.length)];
  const btn=$("#gen");btn.disabled=true;btn.classList.add("busy");btn.innerHTML=GI+"Yapay zeka oluşturuyor…";
  const prompt=`Write ONE paragraph in ${lang} for a language learner at CEFR level ${lvl} (A1 = very basic, C2 = near-native; D1 = literary/academic with idioms and complex syntax beyond C2; D2 = the most demanding: rare vocabulary, nuanced idioms, long complex sentences). Topic: ${topic}. Exactly ${n} sentence${n>1?"s":""}, natural and coherent, vocabulary and grammar matching the level. Keep every sentence SHORT: A1 max 6 words, A2 max 9, B1 max 12, B2 max 16, C1 and C2 max 20 words per sentence; never write long or run-on sentences. Return ONLY JSON: {"text":"the paragraph"}`;
  try{
    const r=await sample.json(prompt,{modelTier:"quick",cache:false});
    $("#src").value=String(r.text||"").trim();$("#usr").value="";$("#usr").focus();updatePot();
  }catch(e){$("#err").textContent="Paragraf üretilemedi: "+(e&&e.message||"")}
  btn.disabled=false;btn.classList.remove("busy");btn.innerHTML=GI+"Paragraf oluştur";
};
$("#auto").onclick=async()=>{
  const src=$("#src").value.trim(),out=$("#autoOut");$("#err").textContent="";
  if(!src){$("#err").textContent="Önce paragrafı yaz.";return}
  const sample=await claude.use("sample");
  if(!sample){$("#err").textContent="Otomatik çeviri şu an kullanılamıyor (önce API adresini gir: Profil Değiştir → API ayarları).";return}
  const b=$("#auto");b.disabled=true;b.textContent="Çevriliyor…";
  try{
    const r=await sample.json(`Detect whether the text is English or Turkish and translate it accurately and naturally into the other language. Return ONLY JSON: {"dir":"İngilizce → Türkçe" or "Türkçe → İngilizce","translation":"the full translation"}\n\nTEXT:\n${src}`,{modelTier:"default",cache:false});
    out.classList.remove("hide");out.innerHTML=`<small>${esc(r.dir)} · otomatik çeviri</small><p style="margin:8px 0 0"><span class="g">${esc(r.translation)}</span></p>`;
  }catch(e){$("#err").textContent="Çeviri yapılamadı: "+(e&&e.message||"")}
  b.disabled=false;b.textContent="Otomatik çevir";
};

$("#go").onclick=async()=>{
  const src=$("#src").value.trim(),usr=$("#usr").value.trim(),name=$("#nm").value.trim();
  $("#err").textContent="";
  if(!name){$("#err").textContent="Lütfen önce adını yaz.";return}
  if(!src||!usr){$("#err").textContent="Lütfen iki alanı da doldur.";return}
  try{localStorage.setItem("cp-name",name)}catch(e){}
  const sample=await claude.use("sample");
  if(!sample){$("#err").textContent="Değerlendirme şu an kullanılamıyor (önce API adresini gir: Profil Değiştir → API ayarları).";return}
  const btn=$("#go");btn.disabled=true;btn.innerHTML='<span class="spin"></span>Çevriliyor…';
  const prompt=`You are a fair and accurate English-Turkish translation teacher who accepts every correct translation, not only the reference one. The learner wrote a SOURCE paragraph (English or Turkish) and their own TRANSLATION into the other language. Split the SOURCE into sentences. For each, compare the learner's translation of that sentence with a correct translation. Return ONLY JSON, no markdown:
{"dir":"İngilizce → Türkçe" or "Türkçe → İngilizce","score":integer 0-100 (overall accuracy),"sentences":[{"source":"source sentence","segments":[{"t":"chunk of the LEARNER's translation, in order, covering all of it","ok":true/false,"fix":"correct replacement if ok is false (empty string if the chunk should simply be deleted)"}],"reference":"a correct translation of the sentence","correct":true if the learner's sentence is essentially correct (minor typos ok),"note":"short explanation in Turkish of the mistakes, or empty"}]}
Chunks should be words or short phrases. Be lenient and fair: any translation that conveys the same meaning with correct grammar is CORRECT, even if it uses different words, synonyms, a different word order or a slightly different level of specificity (for example, alisverise giderim is a valid translation of I go to the shop). Ignore capitalization, punctuation, comma placement and tiny typos that do not change the meaning. Mark ok:false ONLY for real errors: wrong meaning, wrong or missing words that change the meaning, or clear grammar mistakes. Never mark a chunk wrong if your fix would be identical or equivalent to it, and never mark a chunk wrong when you cannot name a real error. Mark a source sentence as correct:true whenever its meaning is conveyed correctly. The reference must be one clean translation (no alternatives, no slashes). The score must reflect meaning and grammar accuracy and be consistent with the segments: if every segment is ok, the score must be exactly 100. If a source sentence was not translated at all, use one segment with t:"(çevrilmemiş)", ok:false, fix: correct translation.
SOURCE:
${src}
LEARNER TRANSLATION:
${usr}`;
  try{
    const r=await sample.json(prompt,{modelTier:"default",cache:false});
    const sents=Array.isArray(r.sentences)?r.sentences:[];
    const nz=x=>String(x||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"");
    sents.forEach(s=>{(s.segments||[]).forEach(g=>{if(!g.ok&&((nz(g.fix)&&nz(g.fix)===nz(g.t))||!nz(g.t)))g.ok=true});if((s.segments||[]).length&&s.segments.every(g=>g.ok))s.correct=true});
    const allOk=sents.length>0&&sents.every(s=>s.correct);
    const a={id:Date.now(),name,lvl:$("#lvl").value,dir:r.dir||"",score:allOk?100:Math.max(0,Math.min(100,Math.round(r.score||0))),src,usr,srcWords:words(src),usrWords:words(usr),sentences:sents,correct:sents.filter(s=>s.correct).length};
    const before=profXP(a.name);a.xp=attXP(a);if(Math.floor((before+a.xp)/2000)>Math.floor(before/2000))a.up=Math.floor((before+a.xp)/2000)+1;attempts.push(a);save();renderResult(a);
    $("#result").scrollIntoView({behavior:"smooth"});
  }catch(e){$("#err").textContent="Bir hata oluştu: "+(e&&e.message||"")+(e&&e.code==="rate_limited"?" (Çok fazla istek, biraz bekle.)":"")}
  btn.disabled=false;btn.textContent="Çevir";
};

const PK="cp-profiles";let profiles=[],cur="";
try{profiles=JSON.parse(localStorage.getItem(PK)||"[]")}catch(e){}
if(!profiles.some(n=>pkey(n)==="enes"))profiles.unshift("Enes");
if(!profiles.some(n=>pkey(n)==="seda"))profiles.push("Seda");
const PWK="cp-pw";let pw={};try{pw=JSON.parse(localStorage.getItem(PWK)||"{}")}catch(e){}
const savePw=()=>{try{localStorage.setItem(PWK,JSON.stringify(pw))}catch(e){}};
async function sha(t){t="cp:"+t;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return "f"+h}}
const ready=(async()=>{if(!pw.enes)pw.enes=await sha("Seda");if(!pw.seda)pw.seda=await sha("Enes");savePw();try{localStorage.setItem(PK,JSON.stringify(profiles))}catch(e){}})();
async function login(n,p,p2){await ready;n=String(n).trim();p=String(p);if(!n)return "Profil adı yazın.";const k=pkey(n);
  if(pw[k]){if(await sha(p)!==pw[k])return "Şifre yanlış."}
  else{if(p.length<3)return "Yeni profil için en az 3 karakterlik bir şifre belirle.";if(p!==p2)return "Şifreler eşleşmiyor.";pw[k]=await sha(p);savePw()}
  enter(n);return ""}
let askName="";
function askPw(n){askName=n;$("#gAskT").textContent=pw[pkey(n)]?n+" için şifre":n+" için yeni şifre belirle";$("#gAskPw").value="";$("#gAskPw2").value="";$("#gAskPw2").classList.toggle("hide",!!pw[pkey(n)]);$("#gAskErr").textContent="";$("#gAsk").classList.remove("hide");$("#gAskPw").focus()}
function allProfiles(){const m={};profiles.forEach(n=>m[pkey(n)]=n);attempts.forEach(a=>{const k=pkey(a.name);if(!m[k])m[k]=a.name||"İsimsiz"});return Object.values(m)}
function chip(){$("#chipN").textContent=cur;$("#chipX").textContent=profXP(cur)+" XP";$("#chipA").textContent=(cur[0]||"?").toUpperCase()}
function showGate(){$("#gList").innerHTML=allProfiles().map(n=>`<div class="pc" data-n="${esc(n)}"><div class="pav big">${esc(n[0].toUpperCase())}</div><b>${esc(n)}</b><div style="color:#fbbf24;font-size:.8rem;font-weight:700">${profXP(n)} XP</div></div>`).join("");
  document.querySelectorAll("#gList .pc").forEach(el=>el.onclick=()=>askPw(el.dataset.n));$("#gName").value="";$("#gPass").value="";$("#gPass2").value="";$("#gErr").textContent="";$("#gate").classList.remove("hide")}
function enter(n){n=String(n).trim();if(!n)return;if(!profiles.some(x=>pkey(x)===pkey(n))){profiles.push(n);try{localStorage.setItem(PK,JSON.stringify(profiles))}catch(e){}}
  cur=allProfiles().find(x=>pkey(x)===pkey(n))||n;$("#nm").value=cur;chip();$("#gate").classList.add("hide");$("#gAsk").classList.add("hide");document.querySelector('nav button[data-t="practice"]').click();restart()}
const goNew=async()=>{$("#gErr").textContent=await login($("#gName").value,$("#gPass").value,$("#gPass2").value)};
$("#gGo").onclick=goNew;$("#gName").onkeydown=$("#gPass").onkeydown=$("#gPass2").onkeydown=e=>{if(e.key==="Enter")goNew()};
const goAsk=async()=>{$("#gAskErr").textContent=await login(askName,$("#gAskPw").value,$("#gAskPw2").value)};
$("#gAskGo").onclick=goAsk;$("#gAskPw").onkeydown=$("#gAskPw2").onkeydown=e=>{if(e.key==="Enter")goAsk()};$("#gAskX").onclick=()=>$("#gAsk").classList.add("hide");$("#swBtn").onclick=showGate;
function updatePot(){const n=words($("#src").value);$("#pot").innerHTML=n?`<b>${n}</b> kelime · Kazanabileceğin XP: <b>${n*10} XP</b> <small>(kelime başı 10 XP)</small>`:""}
$("#src").addEventListener("input",updatePot);updatePot();
$("#gen").innerHTML=GI+"Paragraf oluştur";
showGate();
</script>
